<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kanza Quest</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0a0e14;
            --surface: #1c2128;
            --glass: rgba(28, 33, 40, 0.8);
            --border: rgba(240, 246, 252, 0.1);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.3);
            --pink: #db2777;
            --text-main: #f0f6fc;
            --text-dim: #8b949e;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .container { max-width: 450px; margin: 0 auto; padding: 20px; padding-bottom: 140px; }

        .header-card { 
            background: linear-gradient(135deg, var(--surface), #0d1117);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            position: relative;
        }

        .rank-badge {
            position: absolute; top: 15px; right: 15px;
            background: var(--accent-glow); color: var(--accent);
            padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; border: 1px solid var(--accent);
        }

        .xp-bar-container { height: 10px; background: #000; border-radius: 5px; margin-top: 15px; overflow: hidden; }
        .xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #6ee7b7); transition: width 0.8s ease; }

        .mode-toggle {
            display: flex; background: var(--surface); border-radius: 12px; padding: 5px; margin-bottom: 25px; border: 1px solid var(--border);
        }
        .mode-btn { 
            flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: 600; font-size: 13px; color: var(--text-dim);
        }
        .mode-btn.active.normal { background: var(--accent); color: white; }
        .mode-btn.active.period { background: var(--pink); color: white; }

        .section-header { 
            display: flex; align-items: center; gap: 10px; margin: 25px 0 12px 5px; font-size: 14px; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 1px;
        }

        .habit-grid { display: flex; flex-direction: column; gap: 10px; }

        .habit-card { 
            background: var(--glass); border: 1px solid var(--border); padding: 15px; border-radius: 16px; 
            display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
        }
        .habit-card.done { border-color: var(--accent); background: rgba(16, 185, 129, 0.05); opacity: 0.7; }

        .check-circle { 
            width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border); 
            display: flex; align-items: center; justify-content: center;
        }
        .done .check-circle { background: var(--accent); border-color: var(--accent); }
        .period-mode .done .check-circle { background: var(--pink); border-color: var(--pink); }

        .add-habit-box {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: var(--surface); border: 1px solid var(--border);
            padding: 12px; border-radius: 18px; display: flex; gap: 10px;
        }
        .add-habit-box input { flex: 1; background: transparent; border: none; color: white; outline: none; }
        .add-habit-box button { background: var(--accent); border: none; color: white; padding: 8px 16px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const HABIT_DATA = [
            // SALAH
            { id: "wakeup", label: "Wake up 3:30 AM", pts: 30, cat: "Salah", icon: "⏰", hideInPeriod: true },
            { id: "tahajjud", label: "Tahajjud", pts: 50, cat: "Salah", icon: "✨", hideInPeriod: true },
            { id: "fajr", label: "Fajr Prayer", pts: 25, cat: "Salah", icon: "🌅", hideInPeriod: true },
            { id: "dhuhr", label: "Dhuhr Prayer", pts: 20, cat: "Salah", icon: "☀️", hideInPeriod: true },
            { id: "asr", label: "Asr Prayer", pts: 20, cat: "Salah", icon: "🌤️", hideInPeriod: true },
            { id: "maghrib", label: "Maghrib Prayer", pts: 20, cat: "Salah", icon: "🌇", hideInPeriod: true },
            { id: "isha", label: "Isha Prayer", pts: 20, cat: "Salah", icon: "🌙", hideInPeriod: true },

            // QURAN
            { id: "quran", label: "Read Quran", pts: 40, cat: "Quran", icon: "📖", hideInPeriod: true },
            { id: "waqiah", label: "Surah Al-Waqiah", pts: 20, cat: "Quran", icon: "💎", hideInPeriod: true },
            { id: "yaseen", label: "Surah Yaseen", pts: 20, cat: "Quran", icon: "💚", hideInPeriod: true },
            { id: "rahman", label: "Surah Ar-Rahman", pts: 20, cat: "Quran", icon: "🌿", hideInPeriod: true },

            // FRIDAY SPECIALS
            { id: "kahf", label: "Surah Al-Kahf", pts: 50, cat: "Friday Rituals", icon: "🕯️", hideInPeriod: true, friOnly: true },
            { id: "ghusl", label: "Friday Ghusl", pts: 20, cat: "Friday Rituals", icon: "🚿", hideInPeriod: false, friOnly: true },
            { id: "nails", label: "Cut Nails", pts: 15, cat: "Friday Rituals", icon: "✂️", hideInPeriod: false, friOnly: true },
            { id: "perfume", label: "Apply Perfume / Ittar", pts: 10, cat: "Friday Rituals", icon: "🌸", hideInPeriod: false, friOnly: true },
            { id: "salawat", label: "Increased Salawat", pts: 30, cat: "Friday Rituals", icon: "📿", hideInPeriod: false, friOnly: true },

            // SPIRITUAL/DHIKR
            { id: "tajweed", label: "Learn Tajweed", pts: 30, cat: "Spiritual", icon: "🗣️", hideInPeriod: false },
            { id: "hadith", label: "Read 3 Ahadith", pts: 25, cat: "Spiritual", icon: "📚", hideInPeriod: false },
            { id: "astaghfar", label: "1k Astaghfaar", pts: 40, cat: "Spiritual", icon: "📿", hideInPeriod: false },
            { id: "darood", label: "1k Darood", pts: 40, cat: "Spiritual", icon: "💖", hideInPeriod: false },
            { id: "charity", label: "Charity", pts: 25, cat: "Spiritual", icon: "🤝", hideInPeriod: false },
            
            // PRODUCTIVITY/FASTING
            { id: "water", label: "Drink Water", pts: 15, cat: "Productivity", icon: "💧", hideInPeriod: false },
            { id: "sleep", label: "Sleep before 12AM", pts: 30, cat: "Productivity", icon: "😴", hideInPeriod: false },
            { id: "fasting", label: "Sunnah Fasting", pts: 100, cat: "Fasting", icon: "🍱", hideInPeriod: true, sunnahOnly: true }
        ];

        function App() {
            const [done, setDone] = useState(() => JSON.parse(localStorage.getItem("k_quest_done") || "{}"));
            const [pts, setPts] = useState(() => parseInt(localStorage.getItem("k_quest_xp") || "0"));
            const [isPeriod, setIsPeriod] = useState(() => localStorage.getItem("k_quest_p") === "true");
            const [customs, setCustoms] = useState(() => JSON.parse(localStorage.getItem("k_quest_custom") || "[]"));
            const [input, setInput] = useState("");

            const dateKey = new Date().toISOString().split('T')[0];
            const dayNum = new Date().getDay(); // 0=Sun, 1=Mon, 4=Thu, 5=Fri

            useEffect(() => {
                localStorage.setItem("k_quest_done", JSON.stringify(done));
                localStorage.setItem("k_quest_xp", pts);
                localStorage.setItem("k_quest_p", isPeriod);
                localStorage.setItem("k_quest_custom", JSON.stringify(customs));
            }, [done, pts, isPeriod, customs]);

            const level = Math.floor(pts / 1000);
            const xpInLevel = pts % 1000;

            const toggle = (id, habitPts) => {
                const wasDone = !!done[dateKey]?.[id];
                setDone(p => ({ ...p, [dateKey]: { ...p[dateKey], [id]: !wasDone } }));
                setPts(p => wasDone ? Math.max(0, p - habitPts) : p + habitPts);
            };

            const addCustom = () => {
                if (!input.trim()) return;
                setCustoms([...customs, { id: Date.now().toString(), label: input, pts: 20, cat: "Custom", icon: "⭐", hideInPeriod: false }]);
                setInput("");
            };

            const groupedHabits = useMemo(() => {
                const isSunnahDay = [1, 4].includes(dayNum);
                const isFriday = dayNum === 5;

                const base = [...HABIT_DATA, ...customs].filter(h => {
                    if (isPeriod && h.hideInPeriod) return false;
                    if (h.sunnahOnly && !isSunnahDay) return false;
                    if (h.friOnly && !isFriday) return false;
                    return true;
                });

                return base.reduce((acc, h) => {
                    if (!acc[h.cat]) acc[h.cat] = [];
                    acc[h.cat].push(h);
                    return acc;
                }, {});
            }, [isPeriod, customs, dayNum]);

            return (
                <div className={`container ${isPeriod ? 'period-mode' : ''}`}>
                    <div className="header-card">
                        <span className="rank-badge">LVL {level}</span>
                        <h2 style={{margin:0}}>Kanza's Journey</h2>
                        <div className="xp-bar-container">
                            <div className="xp-bar-fill" style={{width: (xpInLevel/10) + "%"}}></div>
                        </div>
                        <div style={{display:'flex', justifyContent:'space-between', fontSize:'11px', marginTop:'8px', color: 'var(--text-dim)'}}>
                            <span>{xpInLevel} / 1000 XP</span>
                        </div>
                    </div>

                    <div className="mode-toggle">
                        <div className={`mode-btn ${!isPeriod ? 'active normal' : ''}`} onClick={() => setIsPeriod(false)}>Normal</div>
                        <div className={`mode-btn ${isPeriod ? 'active period' : ''}`} onClick={() => setIsPeriod(true)}>Period Mode</div>
                    </div>

                    {Object.entries(groupedHabits).map(([cat, habits]) => (
                        <div key={cat}>
                            <div className="section-header">{cat}</div>
                            <div className="habit-grid">
                                {habits.map(h => {
                                    const isDone = !!done[dateKey]?.[h.id];
                                    return (
                                        <div key={h.id} className={`habit-card ${isDone ? 'done' : ''}`} onClick={() => toggle(h.id, h.pts)}>
                                            <div style={{display:'flex', gap:'15px', alignItems:'center'}}>
                                                <span style={{fontSize:'20px'}}>{h.icon}</span>
                                                <div>
                                                    <div style={{fontWeight:'bold', fontSize:'14px'}}>{h.label}</div>
                                                    <div style={{fontSize:'11px', color: 'var(--text-dim)'}}>+{h.pts} XP</div>
                                                </div>
                                            </div>
                                            <div className="check-circle">
                                                {isDone && <i className="fas fa-check" style={{fontSize:'12px', color:'white'}}></i>}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ))}

                    <div className="add-habit-box">
                        <input value={input} onChange={e => setInput(e.target.value)} placeholder="New Personal Goal..." onKeyPress={e => e.key === 'Enter' && addCustom()} />
                        <button onClick={addCustom}>ADD</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
