<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050a14">

<title>Kanza Gamified Tracker</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body { margin:0; background:#050a14; color:#e2e8f0; font-family:system-ui; }
.card { background:#0f172a; padding:15px; border-radius:16px; margin-bottom:10px; }
button { cursor:pointer; }
.badge { padding:6px 10px; background:#1e293b; border-radius:10px; margin-right:5px; }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const { useState, useEffect, useMemo } = React;

/* ---------------- CONFIG ---------------- */
const HABITS = [
  { id:"fajr", label:"Fajr", cat:"salah", pts:20 },
  { id:"quran", label:"Quran", cat:"quran", pts:30 },
  { id:"dhikr", label:"Dhikr", cat:"dhikr", pts:25 },
  { id:"water", label:"Water", cat:"health", pts:10 },
];

const PERIODS_HIDE = new Set(["fajr"]);

/* ---------------- HELPERS ---------------- */
const getKey = d => d.toISOString().split("T")[0];

const getLast7Days = () => {
  const arr = [];
  for (let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    arr.push(d);
  }
  return arr;
};

/* ---------------- APP ---------------- */
function App(){

const [done,setDone]=useState({});
const [pts,setPts]=useState(0);
const [day,setDay]=useState(new Date());
const [period,setPeriod]=useState(false);

const dk = getKey(day);

/* LOAD */
useEffect(()=>{
  setDone(JSON.parse(localStorage.getItem("done")||"{}"));
  setPts(parseInt(localStorage.getItem("xp")||"0"));
},[]);

/* SAVE */
useEffect(()=>{
  localStorage.setItem("done",JSON.stringify(done));
  localStorage.setItem("xp",pts);
},[done,pts]);

/* TOGGLE */
const toggle = (id)=>{
  const h = HABITS.find(x=>x.id===id);
  const was = !!done[dk]?.[id];

  setDone(p=>({
    ...p,
    [dk]: {...(p[dk]||{}), [id]:!was}
  }));

  setPts(p=>p+(was?-h.pts:h.pts));
};

/* FILTER */
const habitsToday = HABITS.filter(h =>
 (!period || !PERIODS_HIDE.has(h.id))
);

/* PROGRESS */
const completed = habitsToday.filter(h=>done[dk]?.[h.id]).length;
const progress = habitsToday.length ? (completed/habitsToday.length)*100 : 0;

/* LEVEL */
const level = Math.floor(pts/500);
const nextLevelXP = 500 - (pts % 500);

/* STREAK */
const streak = useMemo(()=>{
  let count = 0;
  for(let i=0;i<30;i++){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const k = getKey(d);
    const hs = HABITS.length;
    const comp = HABITS.filter(h=>done[k]?.[h.id]).length;
    if(comp>0) count++;
    else break;
  }
  return count;
},[done]);

/* BADGES */
const badges = [];
if(streak>=3) badges.push("🔥 3 Day Streak");
if(streak>=7) badges.push("🔥 7 Day Streak");
if(pts>=1000) badges.push("💎 1000 XP");

/* RADAR */
const cats=["salah","quran","dhikr","health"];
const radarVals = cats.map(c=>{
  const hs = HABITS.filter(h=>h.cat===c);
  const comp = hs.filter(h=>done[dk]?.[h.id]).length;
  return (comp/hs.length)*100||0;
});

const radarPoints = radarVals.map((v,i)=>{
  const angle=(Math.PI*2*i)/radarVals.length;
  const r=(v/100)*60;
  return [80+Math.cos(angle)*r,80+Math.sin(angle)*r];
}).join(" ");

/* WEEKLY */
const week = getLast7Days().map(d=>{
  const k=getKey(d);
  const comp = HABITS.filter(h=>done[k]?.[h.id]).length;
  return (comp/HABITS.length)*100;
});

/* UI */
return(
<div style={{padding:20}}>

<h2>Kanza Tracker</h2>

<div>XP: {pts} | Level: {level}</div>
<div>Next Level in: {nextLevelXP} XP</div>
<div>🔥 Streak: {streak}</div>

<div style={{margin:"10px 0"}}>
{badges.map((b,i)=><span key={i} className="badge">{b}</span>)}
</div>

{/* CALENDAR */}
<div style={{display:"flex",gap:5,marginBottom:10}}>
{getLast7Days().map(d=>{
const k=getKey(d);
return(
<button key={k} onClick={()=>setDay(d)}>
{d.getDate()}
</button>
);
})}
</div>

{/* PERIOD */}
<div className="card" onClick={()=>setPeriod(!period)}>
{period?"🌸 Period Mode":"🌙 Normal"}
</div>

{/* HABITS */}
{habitsToday.map(h=>{
const isDone=!!done[dk]?.[h.id];
return(
<div key={h.id} className="card"
onClick={()=>toggle(h.id)}
style={{background:isDone?"#0f5132":"#0f172a"}}>
{h.label} (+{h.pts})
</div>
);
})}

{/* PROGRESS */}
<div className="card">
Progress: {Math.round(progress)}%
</div>

{/* RADAR */}
<div className="card">
<svg width="160" height="160">
<polygon points={radarPoints}
fill="rgba(52,211,153,0.3)" stroke="#34d399"/>
</svg>
</div>

{/* BAR */}
<div className="card">
<svg width="100%" height="120">
{week.map((v,i)=>(
<rect key={i}
x={i*40}
y={120-v}
width="25"
height={v}
fill={v>70?"#34d399":"#d4a843"}/>
))}
</svg>
</div>

</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

/* SW */
if ("serviceWorker" in navigator) {
 navigator.serviceWorker.register("./sw.js");
}

</script>
</body>
</html>
