<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050a14">

<title>Kanza Tracker</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body {
  margin:0;
  background:#050a14;
  color:#e2e8f0;
  font-family:system-ui;
}

.card {
  background:#0f172a;
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
  border:1px solid #1e293b;
}

.habit {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  border-radius:20px;
  margin-bottom:10px;
  transition:0.2s;
}

.habit:active {
  transform:scale(0.97);
}

.flame {
  animation: flame 1s infinite alternate;
}

@keyframes flame {
  from { transform: scale(1); }
  to { transform: scale(1.2); }
}

.levelup {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
  animation:fade 0.5s;
}

@keyframes fade {
  from {opacity:0;}
  to {opacity:1;}
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const { useState, useEffect, useMemo } = React;

/* ---------------- CONFIG ---------------- */
const HABITS = [
  { id:"fajr", label:"Fajr", cat:"salah", pts:20 },
  { id:"quran", label:"Quran", cat:"quran", pts:30 },
  { id:"dhikr", label:"Dhikr", cat:"dhikr", pts:25 },
  { id:"water", label:"Water", cat:"health", pts:10 },
];

const PERIODS_HIDE = new Set(["fajr"]);

const getKey = (d) => {
  const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().split("T")[0];
};

const getLast7Days = () => {
  const arr=[];
  for(let i=6;i>=0;i--){
    const d=new Date();
    d.setDate(d.getDate()-i);
    arr.push(d);
  }
  return arr;
};

/* ---------------- APP ---------------- */
function App(){

const [done,setDone]=useState({});
const [pts,setPts]=useState(0);
const [day,setDay]=useState(new Date());
const [period,setPeriod]=useState(false);
const [levelUp,setLevelUp]=useState(false);

const dk = getKey(day);

/* LOAD */
useEffect(()=>{
  setDone(JSON.parse(localStorage.getItem("done")||"{}"));
  setPts(parseInt(localStorage.getItem("xp")||"0"));
},[]);

/* SAVE */
useEffect(()=>{
  localStorage.setItem("done",JSON.stringify(done));
  localStorage.setItem("xp",pts);
},[done,pts]);

/* LEVEL */
const level = Math.floor(pts/500);
const progressXP = pts % 500;

/* TOGGLE */
const toggle = (id)=>{
  const h = HABITS.find(x=>x.id===id);
  const was = !!done[dk]?.[id];

  const newPts = pts + (was?-h.pts:h.pts);

  if(Math.floor(newPts/500) > level){
    setLevelUp(true);
    setTimeout(()=>setLevelUp(false),2000);
  }

  setDone(p=>({
    ...p,
    [dk]: {...(p[dk]||{}), [id]:!was}
  }));

  setPts(newPts);
};

/* FILTER */
const habitsToday = HABITS.filter(h =>
 (!period || !PERIODS_HIDE.has(h.id))
);

/* PROGRESS */
const completed = habitsToday.filter(h=>done[dk]?.[h.id]).length;
const progress = habitsToday.length ? (completed/habitsToday.length)*100 : 0;

/* STREAK */
const streak = useMemo(()=>{
  let count=0;
  for(let i=0;i<30;i++){
    const d=new Date();
    d.setDate(d.getDate()-i);
    const k=getKey(d);
    const comp=HABITS.filter(h=>done[k]?.[h.id]).length;
    if(comp>0) count++;
    else break;
  }
  return count;
},[done]);

/* BADGES */
const badges=[];
if(streak>=3) badges.push("🔥 3 Day Streak");
if(streak>=7) badges.push("🔥 7 Day Streak");
if(pts>=1000) badges.push("💎 1000 XP");

/* RADAR */
const cats=["salah","quran","dhikr","health"];
const radarVals=cats.map(c=>{
  const hs=HABITS.filter(h=>h.cat===c);
  const comp=hs.filter(h=>done[dk]?.[h.id]).length;
  return (comp/hs.length)*100||0;
});

const radarPoints = radarVals.map((v,i)=>{
  const angle=(Math.PI*2*i)/radarVals.length;
  const r=(v/100)*60;
  return [80+Math.cos(angle)*r,80+Math.sin(angle)*r];
}).join(" ");

/* WEEK */
const week = getLast7Days().map(d=>{
  const k=getKey(d);
  const comp=HABITS.filter(h=>done[k]?.[h.id]).length;
  return (comp/HABITS.length)*100;
});

/* UI */
return(
<div style={{padding:20}}>

{/* LEVEL UP SCREEN */}
{levelUp && (
<div className="levelup">
<h1 style={{color:"#34d399"}}>LEVEL UP!</h1>
<h2>Level {level+1}</h2>
</div>
)}

{/* HEADER */}
<h2>Kanza</h2>
<div>Level {level} | XP {pts}</div>

<div style={{height:10,background:"#020617",borderRadius:10,marginBottom:15}}>
<div style={{
width:`${(progressXP/500)*100}%`,
height:"100%",
background:"#34d399",
borderRadius:10
}}/>
</div>

{/* STREAK */}
<div className="card">
🔥 <span className="flame">{streak}</span> Day Streak
</div>

{/* CALENDAR */}
<div style={{display:"flex",gap:5}}>
{getLast7Days().map(d=>{
const k=getKey(d);
return(
<button key={k} onClick={()=>setDay(d)}>
{d.getDate()}
</button>
);
})}
</div>

{/* PERIOD */}
<div className="card" onClick={()=>setPeriod(!period)}>
{period?"🌸 Period Mode":"🌙 Normal"}
</div>

{/* HABITS */}
{habitsToday.map(h=>{
const isDone=!!done[dk]?.[h.id];
return(
<div key={h.id}
className="habit"
onClick={()=>toggle(h.id)}
style={{
background:isDone?"#064e3b":"#0f172a"
}}>
{h.label} (+{h.pts})
</div>
);
})}

{/* PROGRESS */}
<div className="card">
Daily Progress: {Math.round(progress)}%
</div>

{/* BADGES */}
<div className="card">
{badges.length===0?"No badges yet":
badges.map((b,i)=><div key={i}>{b}</div>)}
</div>

{/* RADAR */}
<div className="card">
<svg width="160" height="160">
<polygon points={radarPoints}
fill="rgba(52,211,153,0.3)"
stroke="#34d399"/>
</svg>
</div>

{/* BAR */}
<div className="card">
<svg width="100%" height="120">
{week.map((v,i)=>(
<rect key={i}
x={i*40}
y={120-v}
width="25"
height={v}
fill={v>70?"#34d399":"#fbbf24"}/>
))}
</svg>
</div>

</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

/* SW */
if ("serviceWorker" in navigator) {
 navigator.serviceWorker.register("./sw.js");
}

</script>
</body>
</html>
